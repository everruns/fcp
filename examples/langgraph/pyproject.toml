[project]
name = "fcp-langgraph-example"
version = "0.1.0"
description = "Minimal FCP endpoint implemented with FastAPI and LangGraph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.2.60",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
